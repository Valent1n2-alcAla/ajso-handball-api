api_platform:
    title: AJSO Handball API
    description: API du site de l'AJS Ouistreham Handball (équipes, matchs, actualités, club).
    version: 1.0.0
    defaults:
        stateless: true
        pagination_client_items_per_page: true
        pagination_maximum_items_per_page: 200
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    # Suppression d'un élément encore utilisé (adversaire avec des matchs, gymnase avec des créneaux…)
    # (la liste remplace celle par défaut d'API Platform : ses trois entrées sont reprises)
    exception_to_status:
        Symfony\Component\Serializer\Exception\ExceptionInterface: 400
        ApiPlatform\Metadata\Exception\InvalidArgumentException: 400
        Doctrine\ORM\OptimisticLockException: 409
        Doctrine\DBAL\Exception\ForeignKeyConstraintViolationException: 409
    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header

# Production : pas de documentation publique de l'API
when@prod:
    api_platform:
        enable_docs: false
        enable_swagger_ui: false
        enable_re_doc: false
