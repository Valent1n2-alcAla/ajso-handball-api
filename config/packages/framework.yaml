# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    default_locale: fr
    secret: '%env(APP_SECRET)%'

    # API sans état (JWT) : aucune session
    session: false

    # Derrière un reverse proxy / hébergeur : IP du proxy (ex. « 127.0.0.1,REMOTE_ADDR »), vide sinon
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    # Noms d'hôte acceptés (regex, ex. « ^api\.ajso-handball\.fr$ »), vide = tous
    trusted_hosts: '%env(TRUSTED_HOSTS)%'

    rate_limiter:
        # Formulaire de contact : 5 messages par 10 minutes et par adresse IP
        contact:
            policy: sliding_window
            limit: 5
            interval: '10 minutes'
        # Préinscriptions : 5 par heure et par adresse IP (une famille peut inscrire plusieurs enfants)
        preinscription:
            policy: sliding_window
            limit: 5
            interval: '1 hour'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
